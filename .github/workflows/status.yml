name: status
# Reads the public /api/health of the live site and shows it as a notice (for quick checks).
on:
  workflow_dispatch:
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Read live health
        run: |
          set +e
          D="${{ vars.DOMAIN }}"; D="${D:-cardrestocktracker.com}"
          echo "::notice title=codes::health=$(curl -s -o /dev/null -w '%{http_code}' https://$D/api/health) home=$(curl -s -o /dev/null -w '%{http_code}' https://$D/) uk=$(curl -s -o /dev/null -w '%{http_code}' https://$D/uk)"
          j=$(curl -s --max-time 30 "https://$D/api/health")
          echo "$j" | head -c 3000
          s=$(echo "$j" | node -e "let t='';process.stdin.on('data',d=>t+=d).on('end',()=>{const j=JSON.parse(t);const sh=Object.entries(j.sources||{}).filter(([k])=>k.startsWith('shop_'));console.log(JSON.stringify({audience:j.audience,restocks:j.restocks_24h,itest:j.interval_test,counts:j.counts,age_s:j.age_s,shops_ok:sh.filter(([,v])=>v.last_ok_s!=null&&v.last_ok_s<1800).length+'/'+sh.length,shops_blocked:sh.filter(([,v])=>v.status==='blocked').length,proxy_err:(sh.find(([,v])=>v.status==='blocked')||[])[1]?.err?.slice(0,160)}))})")
          echo "::notice title=health::${s:-EMPTY}"
          echo "::notice title=raw::$(echo "$j" | head -c 900 | tr -d '\n')"
          e=$(echo "$j" | node -e "let t='';process.stdin.on('data',d=>t+=d).on('end',()=>{try{const j=JSON.parse(t);const sh=Object.entries(j.sources||{}).filter(([k])=>k.startsWith('shop_'));const by={};for(const [,v] of sh){const k=(v.status||'?')+' '+(v.http||'')+(v.last_ok_s!=null&&v.last_ok_s<1800?' fresh':' old');by[k]=(by[k]||0)+1}console.log(JSON.stringify({age_s:j.age_s,counts:j.counts,itest:j.interval_test,last_500:j.last_500,ai:j.ai_landings_7d,proxy_mb:j.proxy_mb,shops:by}).slice(0,3000))}catch(e){console.log('parse error '+e.message)}})")
          echo "::notice title=shops::$e"
          for u in /pokemon-restock-data /de/pokemon-karten-bestand /uk/pokemon-restock-data /fr/stock-cartes-pokemon /de/30-jahre-pokemon /uk/30th-celebration /us/30th-celebration /fr/30-ans-pokemon /it/30-anni-pokemon /llms.txt; do
            r=$(curl -s --max-time 40 -w '|%{http_code}' "https://$D$u"); code=${r##*|}; body=${r%|*}
            title=$(echo "$body" | grep -o '<title>[^<]*' | head -1 | cut -c8-140); lede=$(echo "$body" | grep -o 'class="lede">[^<]*' | head -1 | cut -c14-260)
            echo "::notice title=page $u::$code $title — $lede"
          done
