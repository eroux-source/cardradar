# The ONLY way to production (playbook rule: one release route, no manual deploys).
# Push to main → build check → create Cloudflare resources if missing → database migrations
# → deploy → copy secrets from GitHub to Cloudflare → Telegram webhook → health check.
#
# GitHub › Settings › Secrets and variables › Actions
#   Variables: DOMAIN (e.g. mysite.com, no https), BRAND_NAME, SUPPORT_EMAIL, TELEGRAM_BOT_NAME
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (required) + every app secret below (optional, add as you go)
name: release
on:
  push: { branches: [main] }
  workflow_dispatch:
concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOMAIN: ${{ vars.DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci

      - name: Check that the code builds
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Check the Cloudflare token
        run: |
          out=$(npx wrangler whoami 2>&1) || true; echo "$out"
          echo "::notice title=whoami::$(echo "$out" | grep -iE 'account|logged|token|permission|scope|error' | tr '\n' ' ' | cut -c1-900)"

      - name: Create queues and database if missing
        run: |
          set +e
          # every failure becomes a readable annotation on the run
          try() { out=$("$@" 2>&1); rc=$?; echo "$out"; if [ $rc -ne 0 ]; then echo "::error title=$2 $3::$(echo "$out" | tail -12 | tr '\n' ' ' | cut -c1-900)"; fi; return $rc; }
          for q in cardradar-crawl cardradar-alerts cardradar-deliver cardradar-dead; do
            out=$(npx wrangler queues create "$q" 2>&1) || { echo "$out" | grep -qi "already" || echo "::warning title=queue $q::$(echo "$out" | tail -6 | tr '\n' ' ' | cut -c1-600)"; }
          done
          try npx wrangler d1 list --json > d1.json || exit 1
          ID=$(node -e "const a=JSON.parse(require('fs').readFileSync('d1.json','utf8').replace(/^[^\[]*/s,''));const r=a.find(d=>d.name==='cardradar');console.log(r?(r.uuid||r.id):'')")
          if [ -z "$ID" ]; then
            try npx wrangler d1 create cardradar || exit 1
            npx wrangler d1 list --json > d1.json
            ID=$(node -e "const a=JSON.parse(require('fs').readFileSync('d1.json','utf8').replace(/^[^\[]*/s,''));const r=a.find(d=>d.name==='cardradar');console.log(r?(r.uuid||r.id):'')")
          fi
          [ -n "$ID" ] || { echo "::error title=d1::database id not found"; exit 1; }
          [ -n "$DOMAIN" ] || { echo "::error title=DOMAIN missing::Add the repository VARIABLE DOMAIN (e.g. cardrestocktracker.com) in GitHub > Settings > Secrets and variables > Actions > Variables"; exit 1; }
          echo "::notice title=domain::$DOMAIN" 
          echo "::notice title=d1::database $ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          if [ -n "$DOMAIN" ]; then sed -i "/^compatibility_flags/a routes = [{ pattern = \"$DOMAIN\", custom_domain = true }]" wrangler.toml; fi

      - name: Apply database migrations
        run: |
          set +e
          out=$(npx wrangler d1 migrations apply cardradar --remote 2>&1); rc=$?; echo "$out"
          [ $rc -eq 0 ] || { echo "::error title=migrations::$(echo "$out" | tail -12 | tr '\n' ' ' | cut -c1-900)"; exit 1; }

      - name: Deploy
        run: |
          set +e
          B="${{ vars.BRAND_NAME }}"; B="${B:-Card Restock Tracker}"
          S="${{ vars.SUPPORT_EMAIL }}"; S="${S:-hello@$DOMAIN}"
          out=$(npx wrangler deploy \
            --var "BASE_URL:https://$DOMAIN" --var "BRAND_NAME:$B" --var "SUPPORT_EMAIL:$S" \
            --var "CODES_FROM:$B <hello@$DOMAIN>" --var "ALERTS_FROM:$B alerts <alerts@notify.$DOMAIN>" \
            --var "TELEGRAM_BOT_NAME:${{ vars.TELEGRAM_BOT_NAME }}" 2>&1); rc=$?; echo "$out"
          [ $rc -eq 0 ] || { echo "::error title=deploy::$(echo "$out" | tail -15 | tr '\n' ' ' | cut -c1-900)"; exit 1; }

      - name: Copy app secrets from GitHub to Cloudflare (only the ones you added)
        env:
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_WEBHOOK_SECRET: ${{ secrets.WHOP_WEBHOOK_SECRET }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          VAPID_PRIVATE_JWK: ${{ secrets.VAPID_PRIVATE_JWK }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
          PROXY_LIST_UK: ${{ secrets.PROXY_LIST_UK }}
          PROXY_LIST_CA: ${{ secrets.PROXY_LIST_CA }}
          PROXY_LIST_AU: ${{ secrets.PROXY_LIST_AU }}
          PROXY_LIST_JP: ${{ secrets.PROXY_LIST_JP }}
          PROXY_LIST_DE: ${{ secrets.PROXY_LIST_DE }}
          PROXY_LIST_FR: ${{ secrets.PROXY_LIST_FR }}
          PROXY_LIST_NL: ${{ secrets.PROXY_LIST_NL }}
          PROXY_LIST_IT: ${{ secrets.PROXY_LIST_IT }}
          PROXY_LIST_ES: ${{ secrets.PROXY_LIST_ES }}
        run: |
          node -e "const k='WHOP_API_KEY WHOP_WEBHOOK_SECRET POSTMARK_TOKEN RESEND_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET VAPID_PRIVATE_JWK GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET BESTBUY_API_KEY ADMIN_KEY SESSION_SECRET LINE_CHANNEL_TOKEN LINE_CHANNEL_SECRET PROXY_LIST PROXY_LIST_UK PROXY_LIST_CA PROXY_LIST_AU PROXY_LIST_JP PROXY_LIST_DE PROXY_LIST_FR PROXY_LIST_NL PROXY_LIST_IT PROXY_LIST_ES'.split(' ');const o={};for(const n of k)if(process.env[n])o[n]=process.env[n];require('fs').writeFileSync('secrets.json',JSON.stringify(o));console.log('secrets to copy:',Object.keys(o).join(', ')||'none')"
          if [ "$(cat secrets.json)" != "{}" ]; then npx wrangler secret bulk secrets.json; fi
          rm -f secrets.json

      - name: Point the Telegram bot at the site
        if: ${{ env.TG != '' }}
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TGS: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: curl -fsS "https://api.telegram.org/bot$TG/setWebhook" -d "url=https://$DOMAIN/api/telegram/webhook" -d "secret_token=$TGS" -d 'allowed_updates=["message"]' >/dev/null

      - name: Health check (fails the release if the site does not answer)
        run: sleep 25 && curl -fsS "https://$DOMAIN/api/health"
