name = "cardradar"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false   # served only on the custom domain

# Static files (CSS, service worker, manifest, icons)
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false

[vars]
BRAND_NAME = "Card Restock Tracker"   # domain: cardrestocktracker.com; 'Pokémon' only used descriptively in page titles
BASE_URL = "http://localhost:8787"   # set to https://<domain> in production
SUPPORT_EMAIL = "hello@cardrestocktracker.com"
GA_ID = "G-V4X0V6LLD5"   # Google Analytics 4 (property "Card Restock Tracker")
WHOP_PLAN_SOLO = "plan_ydMKXsHg6S0T6"    # Whop "Solo" $5.99 / 30 days (public id, appears in checkout links)
WHOP_PLAN_MULTI = "plan_2U5hmfwpVlY3X"   # Whop "Multi" $14.99 / 30 days
ALERTS_FROM = "Card Restock Tracker <alerts@notify.cardrestocktracker.com>"
CODES_FROM = "Card Restock Tracker <hello@cardrestocktracker.com>"
TELEGRAM_BOT_NAME = ""               # bot username, without @
PRICE_SOLO = "5.99"                  # 27/10/2026: InStock Radar model ($5.99 / $14.99 per 30 days) + free plan
PRICE_MULTI = "14.99"
VAPID_PUBLIC_KEY = "BMAxII6sWYgTbvvIM3e85qmSodeJ7rZZTFtkksSitH3S6nW6dT4DlVASQGYrPAz45VBSJYLaPDfWNQYIskQKcG8"   # public half of the push key pair
INDEXNOW_KEY = "e411abef1fa0fa6fb2de7e9b58aa1882"            # public by design (served at /<key>.txt for Bing)

[[d1_databases]]
binding = "DB"
database_name = "cardradar"
database_id = "00000000-0000-0000-0000-000000000000"  # replaced by `wrangler d1 create cardradar`
migrations_dir = "migrations"

# crawl tasks, alert matching (with a delayed late copy), deliveries
[[queues.producers]]
binding = "CRAWL_QUEUE"
queue = "cardradar-crawl"
[[queues.producers]]
binding = "ALERT_QUEUE"
queue = "cardradar-alerts"
[[queues.producers]]
binding = "DELIVER_QUEUE"
queue = "cardradar-deliver"

[[queues.consumers]]
queue = "cardradar-crawl"
max_batch_size = 10
max_batch_timeout = 2
max_retries = 1
[[queues.consumers]]
queue = "cardradar-alerts"
max_batch_size = 20
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "cardradar-dead"
[[queues.consumers]]
queue = "cardradar-deliver"
max_batch_size = 25
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "cardradar-dead"
[[queues.consumers]]
queue = "cardradar-dead"
max_batch_size = 50

# Store pages and /api/stock: 20 reads per minute per network (resellers' bots)
[[ratelimits]]
name = "PAGE_RL"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[triggers]
# every minute: crawl planner, watchdog, email outbox; hourly/nightly jobs branch on the time
crons = ["* * * * *"]

# Secrets (wrangler secret put …): WHOP_API_KEY, WHOP_WEBHOOK_SECRET, WHOP_PLAN_SOLO,
# WHOP_PLAN_MULTI, POSTMARK_TOKEN, RESEND_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET,
# VAPID_PRIVATE_JWK, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, BESTBUY_API_KEY,
# PROXY_LIST, ADMIN_KEY, SESSION_SECRET

# Node relay for proxied requests (Workers cannot tunnel TLS through an HTTP proxy)
[[containers]]
class_name = "Relay"
scheduling_policy = "durable_object"
images = { relay = { dockerfile = "./relay/Dockerfile" } }

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "relay-v1"
new_sqlite_classes = ["Relay"]
